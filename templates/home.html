<!doctype html>
<html lang="en">
  <head>
    Test html
  </head>
  <link
    rel="stylesheet"
    type="text/css"
    href="{{ url_for('static', filename='css/test.css') }}"
  />
  <body>
    {% block content %} 
        {% if user %}
        <h1 class="greeting user">Hello {{ user }}!</h1>
        {% else %}
        <h1 class="greeting">Hello, World!</h1>
        {% endif %} 
    {% endblock %}
  </body>
</html>
